name: Build & Release

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on: push

# The auto GITHUB_TOKEN needs contents:write to create the draft release
# and upload artifacts on the fork. (Newer repos default to read-only.)
permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  linux_x64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build
        run: yarn --link-duplicates --pure-lockfile

      - name: Release
        if: contains(github.ref, 'develop-outlook')
        run: yarn dist:linux:x64 -- --publish always

  linux_arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
