name: Build & Release

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on: push

# The auto GITHUB_TOKEN needs contents:write to create the draft release
# and upload artifacts on the fork. (Newer repos default to read-only.)
permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # Each platform builds with --publish never and stages its installers as a
  # workflow artifact. Publishing is centralized in the `release` job below so
  # the concurrent arch jobs don't race on GitHub release creation (which
  # previously produced two duplicate draft releases for one version).
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            script: dist:linux:x64
            name: linux-x64
          - runs-on: ubuntu-latest
            script: dist:linux:arm64
            name: linux-arm64
          - runs-on: ubuntu-latest
            script: dist:linux:arm
            name: linux-arm
          - runs-on: macos-latest
            script: dist:mac
            name: mac
          - runs-on: windows-latest
            script: dist:windows
            name: windows

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build
        run: yarn --link-duplicates --pure-lockfile

      - name: Package (no publish)
        run: yarn ${{ matrix.script }} -- --publish never

      - name: Stage installers
        run: |
          mkdir -p artifacts
          find dist -maxdepth 1 -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} artifacts/ \;

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release and upload assets
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          mkdir -p upload
          # Flatten every build artifact into one directory (filenames are
          # unique across arches/platforms).
          find artifacts -type f -exec cp {} upload/ \;
          echo "Uploading $(find upload -type f | wc -l) assets to $TAG"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" upload/* --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "$VERSION" \
              --notes "Draft release $VERSION (built from $GITHUB_SHA)."
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" upload/*
          fi